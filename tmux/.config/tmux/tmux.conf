# IDEAS:
# https://github.com/regen100/dotfiles/blob/master/tmux/.config/tmux/tmux.conf
# https://github.com/josean-dev/dev-environment-files/blob/main/.tmux.conf
# TODO:
# - tmuxinator: setup project default sessions

# -------------------------------------------------------------------------------------------------
# GENERAL SETTINGS
# -------------------------------------------------------------------------------------------------
set -g history-limit 20000
set -g allow-passthrough on

set -sa terminal-features ',*:RGB'
set -g default-terminal "tmux-256color"

# Start index of window/pane with 1, because we're humans, not computers
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on
set -g allow-rename on

# Enable mouse support
set -g mouse on

# Ensure clipboard works between session and inside editors, e.g., nvim
set -s set-clipboard on

# nvim settings
set -g focus-events on
set -sg escape-time 0

# Set parent terminal title to reflect current window in tmux session
set -g set-titles on
set -g set-titles-string "#I:#W"

# -------------------------------------------------------------------------------------------------
# THEME
# -------------------------------------------------------------------------------------------------
# Gruvbox like theme with black bg
# WARN: only use lowercase hex values
color_orange="#d75f00"
color_purple="#d3869b"
color_green="#b8bb26"
color_blue="#83a598"
color_yellow="#fabd2f"
color_red="#fb4934"
color_black="colour232"
color_white="white"
color_grey="#1d2021"

# This is a theme CONTRACT, you are required to define variables below
# Change values, but not remove/rename variables itself
color_dark="$color_black"
color_light="$color_white"
color_session_text="$color_blue"
color_status_text="$color_white"
color_main="$color_orange"
color_secondary="$color_purple"
color_level_ok="$color_green"
color_level_warn="$color_yellow"
color_level_stress="$color_red"
color_window_off_indicator="colour088"
color_window_off_status_bg="colour238"
color_window_off_status_current_bg="colour254"

set -g mode-style "fg=default,bg=$color_main"

# command line style
set -g message-style "fg=$color_main,bg=$color_dark"

# status line style
set -g status-style "fg=$color_status_text,bg=$color_dark"

# window segments in status line
set -g window-status-separator " "
# setw -g window-status-format " #I #W "
# setw -g window-status-current-format " #I #W "
# setw -g window-status-current-style "fg=$color_orange,bold,bg=$color_grey"
setw -g window-status-current-style "fg=$color_orange,bold"

# when window has monitoring notification
setw -g window-status-activity-style "fg=$color_main"

# outline for active pane
setw -g pane-active-border-style "fg=$color_main"

# general status bar settings
set -g status on
set -g status-interval 5
set -g status-position top
set -g status-justify centre
set -g status-right-length 100
set -g status-left-length 25

# define widgets we're going to use in status bar
# note, that this is not the complete list, some of them are loaded from plugins
wg_session="#[fg=$color_session_text] #S #[default]"
wg_date="#[fg=$color_secondary]%h %d %H:%M#[default]"
wg_user_host="#[fg=$color_secondary]#(whoami)#[default]@#H"
wg_is_zoomed="#[fg=$color_dark,bg=$color_secondary]#{?window_zoomed_flag,[Z],}#[default]"
wg_is_keys_off="#[fg=$color_light,bg=$color_window_off_indicator]#([ $(tmux show-option -qv key-table) = 'off' ] && echo 'OFF')#[default]"

set -g status-left "$wg_session$wg_is_keys_off$wg_is_zoomed#{prefix_highlight}"
# set -g status-right "#{prefix_highlight} $wg_is_keys_off $wg_is_zoomed #{sysstat_cpu} | #{sysstat_mem} | #{gpu} | $wg_user_host | $wg_date #{online_status}"
set -g status-right "#{sysstat_cpu} | #{sysstat_mem} | $wg_date | $wg_user_host #{online_status} "

# online and offline icon for tmux-online-status
set -g @online_icon "#[fg=$color_level_ok]●#[default]"
set -g @offline_icon "#[fg=$color_level_stress]●#[default]"

# Configure view templates for tmux-plugin-sysstat "MEM" and "CPU" widget
set -g @sysstat_gpu_view_tmpl 'GPU: #[fg=#{gpu.color}]#{gpu.pused}#[default] #{gpu.gbused}'
set -g @sysstat_cpu_view_tmpl '  #[fg=#{cpu.color}]#{cpu.pused}#[default]'
set -g @sysstat_mem_view_tmpl '  #[fg=#{mem.color}]#{mem.pused}#[default] #{mem.used}'

# Configure colors for tmux-plugin-sysstat "MEM" and "CPU" widget
set -g @sysstat_cpu_color_low "$color_level_ok"
set -g @sysstat_cpu_color_medium "$color_level_warn"
set -g @sysstat_cpu_color_stress "$color_level_stress"

set -g @sysstat_mem_color_low "$color_level_ok"
set -g @sysstat_mem_color_medium "$color_level_warn"
set -g @sysstat_mem_color_stress "$color_level_stress"

set -g @sysstat_swap_color_low "$color_level_ok"
set -g @sysstat_swap_color_medium "$color_level_warn"
set -g @sysstat_swap_color_stress "$color_level_stress"

# -------------------------------------------------------------------------------------------------
# KEYBINDS
# -------------------------------------------------------------------------------------------------
# bind
# - add -r for repeatability

unbind C-b # default prefix
unbind C-Space
set -g prefix C-Space
bind C-Space send-prefix
# Set Ctrl-s as a nested prefix
bind -n C-s send-prefix

# Reload tmux configuration
bind r source-file ~/.config/tmux/tmux.conf
# new window and retain cwd
bind c new-window -c "#{pane_current_path}"

# Split panes
unbind s    # sesion selector
bind M-s choose-session
unbind %    # split-window -h
unbind '"'  # split-window
bind v split-window -h -c "#{pane_current_path}"
bind s split-window -v -c "#{pane_current_path}"
bind S split-window -v -l 30 -c "#{pane_current_path}"

bind R command-prompt -I "#{window_name}" "rename-window '%%'"
# bind r command-prompt -I "#{window_name}" "rename-window '%%'"
# bind R command-prompt -I "#{session_name}" "rename-session '%%'"

bind -r Tab last-window   # cycle thru MRU tabs
bind -r C-o swap-pane -D

unbind-key Escape
bind -r M-, swap-window -t -1\; select-window -t -1
bind -r M-. swap-window -t +1\; select-window -t +1
bind H swap-pane -d -t -1
bind L swap-pane -d -t +1

unbind n # next-window
unbind p # previous-window
unbind l # last-window
bind p previous-window
bind n next-window

# pane resizing
bind -r C-h resize-pane -L 10
bind -r C-j resize-pane -D 10
bind -r C-k resize-pane -U 10
bind -r C-l resize-pane -R 10

# Use that juicy tmux-sessionizer script bound to <C-a>f
bind-key -r f run-shell "tmux neww tmux-projects"

# Add a binding for copy mode as we remapped prefix-[
bind m copy-mode

unbind =
bind = select-layout even-horizontal

## Join windows: <prefix> s, <prefix> j
# Join vertically
bind j choose-window "join-pane -h -s '%%'"
# Join horizontally
bind J choose-window "join-pane -v -s '%%'"
# send current pane to specified pane
bind e choose-window "join-pane -t '%%'"
bind b break-pane
# break to new session
bind B command-prompt -p "Enter new session name:" "new-session -d -s '%1'; move-window -t '%1'"

# Also, change some visual styles when window keys are off
bind -T root F12  \
    set prefix None \;\
    set key-table off \;\
    set status-style "fg=$color_status_text,bg=$color_window_off_status_bg" \;\
    set window-status-current-format "#[fg=$color_window_off_status_bg,bg=$color_window_off_status_current_bg]$separator_powerline_right#[default] #I:#W# #[fg=$color_window_off_status_current_bg,bg=$color_window_off_status_bg]$separator_powerline_right#[default]" \;\
    set window-status-current-style "fg=$color_dark,bold,bg=$color_window_off_status_current_bg" \;\
    if -F '#{pane_in_mode}' 'send-keys -X cancel' \;\
    refresh-client -S \;\

bind -T off F12 \
    set -u prefix \;\
    set -u key-table \;\
    set -u status-style \;\
    set -u window-status-current-style \;\
    set -u window-status-current-format \;\
    refresh-client -S


# Prefer vi style key table
setw -g mode-keys vi

# bind p paste-buffer
bind M-p choose-buffer

# When scrolling with mouse wheel, reduce number of scrolled rows per tick to "2" (default is 5)
bind -T copy-mode-vi WheelUpPane select-pane \; send-keys -X -N 2 scroll-up
bind -T copy-mode-vi WheelDownPane select-pane \; send-keys -X -N 2 scroll-down

bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi C-v send -X rectangle-toggle
bind -T copy-mode-vi y send -X copy-selection # copy-selection-and-cancel
bind -T copy-mode-vi Escape send -X cancel

# Source some overrides for SSH connections
if-shell 'test -n "$SSH_CLIENT"' 'source-file $XDG_CONFIG_HOME/tmux/tmux.remote.conf'

# -------------------------------------------------------------------------------------------------
# PLUGINS
# -------------------------------------------------------------------------------------------------

# set -g @yank_action 'copy-pipe' # remain in copy mode, or 'copy-pipe-and-cancel' for the default
set -g @route_to_ping "8.8.8.8"
set -g @prefix_highlight_empty_prompt '        '          # default is '' (empty char), for alignment

# =================
# tmux.nvim plugins

# check for vim in current pane
is_vim="ps -o state= -o comm= -t '#{pane_tty}' | grep -iqE '^[^TXZ ]+ +(\\S+\\/)?g?(view|n?vim?x?)(diff)?$'"

# Check if SSH is running
is_ssh='#{==:#{pane_current_command},ssh}'

# These binds navigate any tmux (nested or otherwise) panes
bind-key -n 'C-h' if-shell "$is_vim" 'send-keys C-h' {
    if-shell -F "$is_ssh" {
        if -F '#{pane_at_left}' 'send-keys C-h' 'select-pane -L'

    } {
        if -F '#{pane_at_left}' '' 'select-pane -L'
    }
}

bind-key -n 'C-j' if-shell "$is_vim" 'send-keys C-j' {
    if-shell -F "$is_ssh" {
        if -F '#{pane_at_bottom}' 'send-keys C-j' 'select-pane -D'
    } {
        if -F '#{pane_at_bottom}' '' 'select-pane -D'
    }
}

bind-key -n 'C-k' if-shell "$is_vim" 'send-keys C-k' {
    if-shell -F "$is_ssh" {
        if -F '#{pane_at_top}' 'send-keys C-k' 'select-pane -U'
    } {
        if -F '#{pane_at_top}' '' 'select-pane -U'
    }
}

bind-key -n 'C-l' if-shell "$is_vim" 'send-keys C-l' {
    if-shell -F "$is_ssh" {
        if -F '#{pane_at_right}' 'send-keys C-l' 'select-pane -R'
    } {
        if -F '#{pane_at_right}' '' 'select-pane -R'

    }
}

bind-key -T copy-mode-vi 'C-h' if -F '#{pane_at_left}' '' 'select-pane -L'
bind-key -T copy-mode-vi 'C-j' if -F '#{pane_at_bottom}' '' 'select-pane -D'
bind-key -T copy-mode-vi 'C-k' if -F '#{pane_at_top}' '' 'select-pane -U'
bind-key -T copy-mode-vi 'C-l' if -F '#{pane_at_right}' '' 'select-pane -R'

# ========================
# Setup the plugin manager
set-environment -g TMUX_PLUGIN_MANAGER_PATH '~/.local/share/tmux/plugins'
TMUX_PLUGIN_MANAGER_PATH='~/.local/share/tmux/plugins'
if "[ ! -d $TMUX_PLUGIN_MANAGER_PATH/tpm ]" \
    "run 'mkdir -p $TMUX_PLUGIN_MANAGER_PATH && \
    git clone https://github.com/tmux-plugins/tpm $TMUX_PLUGIN_MANAGER_PATH/tpm && \
    $TMUX_PLUGIN_MANAGER_PATH/tpm/bin/install_plugins'"

set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-prefix-highlight'
set -g @plugin 'tmux-plugins/tmux-online-status'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'
set -g @plugin 'tmux-plugins/tmux-copycat'
set -g @plugin 'tmux-plugins/tmux-open'
set -g @plugin 'samoshkin/tmux-plugin-sysstat'
set -g @plugin 'arminveres/tmux-plugin-gpu'
# set -g @plugin 'tmux-plugins/tmux-yank'

set -g @continuum-restore 'off'

run $TMUX_PLUGIN_MANAGER_PATH'/tpm/tpm'
